apiVersion: batch/v1
kind: Job
metadata:
  generateName: maya-gfx906-test-
  namespace: apps-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        feature.node.kubernetes.io/amd-gpu: "true"
      tolerations:
        - key: feature.node.kubernetes.io/amd-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: feature.node.kubernetes.io/nvidia-gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: feature.node.kubernetes.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: harbor-registry-pull-secret
      containers:
        - name: test
          image: registry.arkprojects.space/apps/maya-gfx906:v1.1.21-rocm-10.1-test
          imagePullPolicy: Always
          env:
            - name: HIP_VISIBLE_DEVICES
              value: "0"
            - name: HSA_XNACK
              value: "0"
            - name: OMP_NUM_THREADS
              value: "2"
          securityContext:
            # hostPath does not grant device-cgroup access. This cluster has no
            # AMD device-plugin allocation; match the existing apps-ml GPU pods.
            privileged: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: kfd
              mountPath: /dev/kfd
            - name: dri
              mountPath: /dev/dri
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: kfd
          hostPath:
            path: /dev/kfd
            type: CharDevice
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
