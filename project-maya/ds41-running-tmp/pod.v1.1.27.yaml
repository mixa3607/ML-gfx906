# Completed TP4 experiment, pod deleted; no automatic retry. See RESULTS.md.
# Historical final cap: 199Gi plus peer within the revised 200Gi budget.
apiVersion: v1
kind: Pod
metadata:
  name: maya-ds41-bench-v127
  namespace: apps-ml
  labels:
    app: maya-ds41-bench-v127
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  nodeSelector:
    kubernetes.io/hostname: kube-worker6.arkprojects.lan
  tolerations:
    - key: feature.node.kubernetes.io/amd-gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
    - key: feature.node.kubernetes.io/nvidia-gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  imagePullSecrets:
    - name: harbor-registry-pull-secret
  containers:
    - name: bench
      image: docker.io/mixa3607/maya-gfx906@sha256:d46312703b79af1cd70174ae9ef2faee23875db9c51f90353424aba6101ac2c1
      imagePullPolicy: Always
      command: ["/bin/bash", "-lc", "ulimit -l unlimited; exec sleep infinity"]
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0,1,2,3"
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          # Leave 1Gi for the stopped v1.1.26 pod's retained cache/accounting.
          memory: 199Gi
      volumeMounts:
        - {name: hf-cache, mountPath: /root/.cache/huggingface, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: dev-kfd, mountPath: /dev/kfd}
        - {name: dev-dri, mountPath: /dev/dri}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - name: hf-cache
      persistentVolumeClaim:
        claimName: worker6-hf-cache
        readOnly: true
    - name: data
      emptyDir: {}
    - name: dev-kfd
      hostPath: {path: /dev/kfd}
    - name: dev-dri
      hostPath: {path: /dev/dri}
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
