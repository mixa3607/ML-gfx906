# export HF_CACHE_DIR=/srv/ml/shared-hf-cache
# export RENDER_GID=$(getent group render | cut -d: -f3)
# docker compose -f docker-compose.example.yaml up -d

services:
  maya:
    image: ${MAYA_IMAGE:?set MAYA_IMAGE}
    container_name: maya
    command: [serve]
    environment:
      MAYA_CONFIG: ${MAYA_CONFIG:?set MAYA_CONFIG}
      HIP_VISIBLE_DEVICES: "${HIP_VISIBLE_DEVICES:-0,1,2,3}"
      HSA_XNACK: "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - "${RENDER_GID:?set RENDER_GID}"
    cap_add:
      - IPC_LOCK
    security_opt:
      - seccomp=unconfined
    shm_size: 2gb
    ulimits:
      memlock:
        soft: -1
        hard: -1
