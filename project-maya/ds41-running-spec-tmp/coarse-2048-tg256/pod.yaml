apiVersion: v1
kind: Pod
metadata:
  name: maya-ds41-dspark-coarse-2048
  namespace: apps-ml
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  nodeSelector:
    kubernetes.io/hostname: kube-worker6.arkprojects.lan
  tolerations:
    - {key: feature.node.kubernetes.io/amd-gpu, operator: Equal, value: "true", effect: NoSchedule}
    - {key: feature.node.kubernetes.io/nvidia-gpu, operator: Equal, value: "true", effect: NoSchedule}
  imagePullSecrets:
    - name: harbor-registry-pull-secret
  containers:
    - name: bench
      image: docker.io/mixa3607/maya-gfx906@sha256:3cf3dba357c941a190630b0fcf33efd501fe693d9510fa7332522f4b072e30d3
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-ec", "ulimit -l unlimited; exec sleep infinity"]
      securityContext:
        privileged: true
        runAsUser: 0
      env:
        - {name: HIP_VISIBLE_DEVICES, value: "0,1,2,3"}
        - {name: HF_HUB_OFFLINE, value: "1"}
        - {name: TRANSFORMERS_OFFLINE, value: "1"}
      resources:
        requests: {cpu: "4", memory: 220Gi}
        limits: {memory: 220Gi}
      volumeMounts:
        - {name: hf-cache, mountPath: /root/.cache/huggingface, readOnly: true}
        - {name: existing, mountPath: /existing, readOnly: true}
        - {name: data, mountPath: /data}
        - {name: dev-kfd, mountPath: /dev/kfd}
        - {name: dev-dri, mountPath: /dev/dri}
        - {name: shm, mountPath: /dev/shm}
  volumes:
    - name: hf-cache
      persistentVolumeClaim: {claimName: worker6-hf-cache, readOnly: true}
    - name: existing
      persistentVolumeClaim: {claimName: maya-ds41-decode-data, readOnly: true}
    - name: data
      emptyDir: {}
    - name: dev-kfd
      hostPath: {path: /dev/kfd}
    - name: dev-dri
      hostPath: {path: /dev/dri}
    - name: shm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
