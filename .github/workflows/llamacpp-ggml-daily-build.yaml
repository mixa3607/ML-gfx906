name: Daily llama.cpp build (ggml)

on:
  workflow_dispatch:
    inputs:
      llamacpp_tag:
        description: "llama.cpp tag to build (empty = latest)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            llamacpp_tag: "${{ inputs.llamacpp_tag }}"
            release_tag: "20260802001858"
          - rocm_version: "6.3.3"
            llamacpp_tag: "${{ inputs.llamacpp_tag }}"
            release_tag: "20260802001858"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}

      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        env:
          LLAMA_REPO: "https://github.com/ggml-org/llama.cpp.git"
          LLAMA_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
          LLAMA_BRANCH: "${{ matrix.build.llamacpp_tag }}"
          LLAMA_IS_RELEASE: "1"
          LLAMA_CMAKE_HIP_FLAGS: "-mllvm -amdgpu-sched-strategy=max-ilp"
        run: |
          cd ./llama.cpp
          if [ "$LLAMA_BRANCH" == "" ]; then
            export LLAMA_BRANCH="$(curl -L \
              -H "Accept: application/vnd.github+json" \
              'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=1' | yq -r '.[0].tag_name')"
          fi
          . preset.partial.rocm-7.14-ggml.sh
          ./build-and-push.image.sh
