name: Daily ROCm toolkit build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        run: |
          cd ./rocm-toolkit
          export ROCM_VERSION="${{ matrix.build.rocm_version }}"
          ./build-and-push.image.sh
