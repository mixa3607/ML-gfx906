name: Build ROCm Validation Suite DEB

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "**"
    paths:
      - "rocm-validation-suite/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            rvs_version: "v1.6.0"
    steps:
      - uses: actions/checkout@v7

      - name: Build DEB package
        working-directory: rocm-validation-suite
        run: |
          export ROCM_VERSION="${{ matrix.build.rocm_version }}"
          export RVS_VERSION="${{ matrix.build.rvs_version }}"
          export RVS_PUSH=0
          ./build-and-push.deb.sh

      - name: Upload DEB package
        uses: actions/upload-artifact@v6
        with:
          name: rocm-validation-suite-${{ matrix.build.rvs_version }}-rocm-${{ matrix.build.rocm_version }}-deb
          path: rocm-validation-suite/output/**/*.deb
          if-no-files-found: error
          retention-days: 14
