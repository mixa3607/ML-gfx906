name: Daily ComfyUI build

on:
  workflow_dispatch:
    inputs:
      comfyui_tag:
        description: "ComfyUI tag to build (empty = latest)"
        required: false
        default: ""
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            pytorch_version: "2.13.0"
            comfyui_tag: "${{ inputs.comfyui_tag }}"
            release_tag: "20261006020817"
    env:
      COMFYUI_PYTORCH_VERSION: "${{ matrix.build.pytorch_version }}"
      COMFYUI_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      COMFYUI_BRANCH: "${{ matrix.build.comfyui_tag }}"
      COMFYUI_REPO: "https://github.com/Comfy-Org/ComfyUI.git"
      COMFYUI_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: |
          source ./env.sh
          COMFYUI_IS_RELEASE=0
          if [ -n "$(git_get_current_tag)" ]; then
            COMFYUI_IS_RELEASE=1
          fi
          if [ "$COMFYUI_BRANCH" == "" ]; then
            COMFYUI_BRANCH="$("$GITHUB_WORKSPACE/.github/scripts/github_get_last" --type release --repo "$COMFYUI_REPO" --github-token "$GITHUB_TOKEN")"
          fi

          echo "COMFYUI_IS_RELEASE=$COMFYUI_IS_RELEASE" >> "$GITHUB_ENV"
          echo "REPO_GIT_REF=$REPO_GIT_REF" >> "$GITHUB_ENV"
          echo "COMFYUI_BRANCH=$COMFYUI_BRANCH" >> "$GITHUB_ENV"
          source ./env.sh "comfyui" "pytorch"
          echo "COMFYUI_BASE_IMAGE=$COMFYUI_TORCH_IMAGE:v$COMFYUI_PYTORCH_VERSION-rocm-$COMFYUI_ROCM_VERSION" >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./comfyui/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$COMFYUI_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build ComfyUI image
        if: steps.check.outputs.needed == 'true'
        run: ./comfyui/build-and-push.image.sh build
