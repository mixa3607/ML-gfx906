name: Daily ComfyUI build

on:
  workflow_dispatch:
    inputs:
      comfyui_tag:
        description: "ComfyUI tag to build (empty = latest)"
        required: false
        default: ""
  #schedule:
  #  - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            pytorch_version: "2.13.0"
            comfyui_tag: "${{ inputs.comfyui_tag }}"
            release_tag: "20260802001858"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}

      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        env:
          COMFYUI_PYTORCH_VERSION: "${{ matrix.build.pytorch_version }}"
          COMFYUI_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
          COMFYUI_BRANCH: "${{ matrix.build.comfyui_tag }}"
        run: |
          cd ./comfyui
          if [ "$COMFYUI_BRANCH" == "" ]; then
            export COMFYUI_BRANCH="$(curl -L \
              -H "Accept: application/vnd.github+json" \
              'https://api.github.com/repos/Comfy-Org/ComfyUI/releases?per_page=1' | yq -r '.[0].tag_name')"
          fi
          ./build-and-push.image.sh
