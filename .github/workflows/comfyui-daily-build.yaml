name: Daily ComfyUI build

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          #- rocm_version: "6.3.3"
          #  pytorch_version: "2.11.0"
          #  comfyui_tag: ""
          #  release_tag: "master"
          - rocm_version: "7.2.1"
            pytorch_version: "2.11.0"
            comfyui_tag: ""
            release_tag: "master"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}

      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        env:
          COMFYUI_PYTORCH_VERSION: "${{ matrix.build.pytorch_version }}"
          COMFYUI_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
          COMFYUI_BRANCH: "${{ matrix.build.comfyui_tag }}"
        run: |
          cd ./comfyui
          if [ "$COMFYUI_BRANCH" == "" ]; then
            export COMFYUI_BRANCH="$(curl -L \
              -H "Accept: application/vnd.github+json" \
              'https://api.github.com/repos/Comfy-Org/ComfyUI/releases?per_page=1' | yq -r '.[0].tag_name')"
          fi
          ./build-and-push.comfyui.sh
