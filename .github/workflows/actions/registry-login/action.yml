name: Select registry and log in
description: Use Docker Hub when credentials are configured, otherwise GHCR

inputs:
  dockerhub-username:
    description: Docker Hub username
    required: false
    default: ""
  dockerhub-token:
    description: Docker Hub token
    required: false
    default: ""

outputs:
  registry_type:
    description: Selected registry type
    value: ${{ steps.select.outputs.registry_type }}
  registry_root:
    description: Image namespace
    value: ${{ steps.select.outputs.registry_root }}

runs:
  using: composite
  steps:
    - name: Select registry
      id: select
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: |
        REGISTRY_TYPE="ghcr"
        REGISTRY_ROOT="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          REGISTRY_TYPE="dockerhub"
          REGISTRY_ROOT="docker.io/$DOCKERHUB_USERNAME"
        fi

        echo "registry_type=$REGISTRY_TYPE" >> "$GITHUB_OUTPUT"
        echo "registry_root=$REGISTRY_ROOT" >> "$GITHUB_OUTPUT"
        echo "REGISTRY_ROOT=$REGISTRY_ROOT" >> "$GITHUB_ENV"

    - name: Log in to Docker Hub
      if: steps.select.outputs.registry_type == 'dockerhub'
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Log in to GHCR
      if: steps.select.outputs.registry_type == 'ghcr'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
