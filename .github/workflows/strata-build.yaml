name: Daily Strata build

on:
  workflow_dispatch:
    inputs:
      strata_tag:
        description: "Strata tag to build (empty = latest)"
        required: false
        default: ""
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Strata (ROCm ${{ matrix.build.rocm_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - rocm_version: "10.1"
            release_tag: "20261027183317"
    env:
      STRATA_REPO: "https://github.com/Niko1221/Strata.git"
      STRATA_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      STRATA_BRANCH: "${{ inputs.strata_tag }}"
      STRATA_PATCH: "v0.2.3.1.patch"
      STRATA_CMAKE_HIP_FLAGS: "-mllvm -amdgpu-sched-strategy=max-ilp"
      STRATA_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.BUILD_REF || matrix.build.release_tag }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select registry and log in
        id: registry
        uses: ./.github/workflows/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          REGISTRY_ROOT: "${{ steps.registry.outputs.registry_root }}"
        run: |
          source ./.build/git-common.sh
          if [ "$STRATA_BRANCH" == "" ]; then
            STRATA_BRANCH="$("$GITHUB_WORKSPACE/.github/scripts/github_get_last" --type release --repo "$STRATA_REPO" --github-token "$GITHUB_TOKEN")"
          fi
          : "${REPO_GIT_REF:="$(git_get_current_ref)"}"
          : "${STRATA_IMAGE:="$REGISTRY_ROOT/strata-gfx906"}"
          : "${STRATA_IS_RELEASE:="$([ -n "$(git_get_current_tag)" ] && echo 1 || echo 0)"}"
          : "${STRATA_BASE_IMAGE:="docker.io/mixa3607/rocm-gfx906:$STRATA_ROCM_VERSION-complete"}"
          : "${STRATA_PRESET_NAME:="$STRATA_BRANCH-rocm-$STRATA_ROCM_VERSION"}"

          echo "REPO_GIT_REF=$REPO_GIT_REF"             >> "$GITHUB_ENV"
          echo "STRATA_IMAGE=$STRATA_IMAGE"             >> "$GITHUB_ENV"
          echo "STRATA_IS_RELEASE=$STRATA_IS_RELEASE"   >> "$GITHUB_ENV"
          echo "STRATA_BRANCH=$STRATA_BRANCH"           >> "$GITHUB_ENV"
          echo "STRATA_PRESET_NAME=$STRATA_PRESET_NAME" >> "$GITHUB_ENV"
          echo "STRATA_BASE_IMAGE=$STRATA_BASE_IMAGE"   >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./strata/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$STRATA_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build Strata image
        if: steps.check.outputs.needed == 'true'
        run: ./strata/build-and-push.image.sh build
