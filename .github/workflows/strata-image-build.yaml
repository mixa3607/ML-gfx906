name: Strata image build

on:
  push:
    branches:
      - strata-gfx906
  workflow_dispatch:
    inputs:
      strata_tag:
        description: "Strata tag to build (empty = v0.1.41)"
        required: false
        default: "v0.1.41"
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 16 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            strata_tag: "v0.1.41"
    env:
      STRATA_REPO: "https://github.com/Niko1221/Strata.git"
      STRATA_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      STRATA_BRANCH: "${{ github.event.inputs.strata_tag || matrix.build.strata_tag }}"
      STRATA_PATCH: "gfx906-setup.patch"
      STRATA_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
      # A push of this branch verifies the image on GitHub-hosted runners and
      # does not publish it. workflow_dispatch and the schedule publish.
      STRATA_PUSH: ${{ github.event_name == 'push' && '0' || '1' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        run: |
          source ./env.sh
          STRATA_IS_RELEASE=0
          if [ -n "$(git_get_current_tag)" ]; then
            STRATA_IS_RELEASE=1
          fi
          if [ "$STRATA_BRANCH" == "" ]; then
            STRATA_BRANCH="${{ matrix.build.strata_tag }}"
          fi

          echo "STRATA_IS_RELEASE=$STRATA_IS_RELEASE" >> "$GITHUB_ENV"
          echo "REPO_GIT_REF=$REPO_GIT_REF" >> "$GITHUB_ENV"
          echo "STRATA_BRANCH=$STRATA_BRANCH" >> "$GITHUB_ENV"
          echo "STRATA_PRESET_NAME=$STRATA_BRANCH-rocm-$STRATA_ROCM_VERSION" >> "$GITHUB_ENV"
          source ./env.sh "strata" "rocm"
          echo "STRATA_BASE_IMAGE=$ROCM_IMAGE:$STRATA_ROCM_VERSION-complete" >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./strata/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$STRATA_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build Strata image
        if: steps.check.outputs.needed == 'true'
        run: ./strata/build-and-push.image.sh build
