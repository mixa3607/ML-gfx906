name: Strata image build

on:
  push:
    branches:
      - strata-gfx906
  workflow_dispatch:
    inputs:
      strata_tag:
        description: "Strata tag to build (empty = v0.1.41)"
        required: false
        default: "v0.1.41"
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 16 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            strata_tag: "v0.1.41"
    env:
      STRATA_REPO: "https://github.com/Niko1221/Strata.git"
      STRATA_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      STRATA_BRANCH: "${{ github.event.inputs.strata_tag || matrix.build.strata_tag }}"
      STRATA_PATCH: "gfx906-setup.patch"
      STRATA_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
      STRATA_PUSH: "1"
      # This fork publishes to the owner's GHCR package. The upstream repo keeps
      # the Docker Hub name used by the rest of ML-gfx906.
      STRATA_IMAGE: ${{ github.repository_owner == 'mixa3607' && 'docker.io/mixa3607/strata-gfx906' || format('ghcr.io/{0}/strata-gfx906', github.repository_owner) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.repository_owner != 'mixa3607'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository_owner == 'mixa3607'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        run: |
          source ./env.sh
          STRATA_IS_RELEASE=0
          if [ -n "$(git_get_current_tag)" ]; then
            STRATA_IS_RELEASE=1
          fi
          if [ "$STRATA_BRANCH" == "" ]; then
            STRATA_BRANCH="${{ matrix.build.strata_tag }}"
          fi

          echo "STRATA_IS_RELEASE=$STRATA_IS_RELEASE" >> "$GITHUB_ENV"
          echo "REPO_GIT_REF=$REPO_GIT_REF" >> "$GITHUB_ENV"
          echo "STRATA_BRANCH=$STRATA_BRANCH" >> "$GITHUB_ENV"
          echo "STRATA_PRESET_NAME=$STRATA_BRANCH-rocm-$STRATA_ROCM_VERSION" >> "$GITHUB_ENV"
          source ./env.sh "strata" "rocm"
          echo "STRATA_BASE_IMAGE=$ROCM_IMAGE:$STRATA_ROCM_VERSION-complete" >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./strata/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$STRATA_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build Strata image
        if: steps.check.outputs.needed == 'true'
        run: ./strata/build-and-push.image.sh build

      - name: Make the GHCR package public
        if: steps.check.outputs.needed == 'true' && github.repository_owner != 'mixa3607'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/strata-gfx906" \
            -f visibility=public
