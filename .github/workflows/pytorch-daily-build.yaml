name: Daily PyTorch build

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "0 14 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            torch_version: "v2.13.0"
            release_tag: "20260802001858"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}

      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        run: |
          cd ./pytorch
          export TORCH_ROCM_VERSION="${{ matrix.build.rocm_version }}"
          export TORCH_VERSION="${{ matrix.build.torch_version }}"
          ./build-and-push.image.sh
