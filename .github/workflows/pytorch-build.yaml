name: Daily PyTorch build

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build PyTorch (${{ matrix.build.torch_version }}, ROCm ${{ matrix.build.rocm_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - rocm_version: "7.14"
            torch_version: "v2.14.1"
            release_tag: "20260802001858"
          - rocm_version: "10.0"
            torch_version: "v2.14.1"
            release_tag: "20260802001858"
          - rocm_version: "10.1"
            torch_version: "v2.14.1"
            release_tag: "20260802001858"
    env:
      TORCH_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      TORCH_VERSION: "${{ matrix.build.torch_version }}"
      TORCH_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.BUILD_REF || matrix.build.release_tag }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select registry and log in
        id: registry
        uses: ./.github/workflows/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          REGISTRY_ROOT: "${{ steps.registry.outputs.registry_root }}"
        run: |
          source ./.build/git-common.sh
          : "${REPO_GIT_REF:="$(git_get_current_ref)"}"
          : "${TORCH_IMAGE:="$REGISTRY_ROOT/pytorch-gfx906"}"
          : "${TORCH_IS_RELEASE:="$([ -n "$(git_get_current_tag)" ] && echo 1 || echo 0)"}"
          : "${TORCH_BASE_IMAGE:="docker.io/mixa3607/rocm-gfx906:$TORCH_ROCM_VERSION-complete"}"

          echo "REPO_GIT_REF=$REPO_GIT_REF"         >> "$GITHUB_ENV"
          echo "TORCH_IMAGE=$TORCH_IMAGE"           >> "$GITHUB_ENV"
          echo "TORCH_IS_RELEASE=$TORCH_IS_RELEASE" >> "$GITHUB_ENV"
          echo "TORCH_BASE_IMAGE=$TORCH_BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./pytorch/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base image
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$TORCH_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build PyTorch image
        if: steps.check.outputs.needed == 'true'
        run: ./pytorch/build-and-push.image.sh build
