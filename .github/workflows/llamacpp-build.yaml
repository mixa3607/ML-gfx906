name: Daily llama.cpp build

on:
  workflow_dispatch:
    inputs:
      llamacpp_tag:
        description: "llama.cpp tag for both sources (empty = latest per source)"
        required: false
        default: ""
      force_build:
        description: "Rebuild even if the image is already published"
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build llama.cpp (${{ matrix.build.source }}, ROCm ${{ matrix.build.rocm_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - source: "ggml"
            repo: "https://github.com/ggml-org/llama.cpp.git"
            latest_type: "release"
            profile_suffix: ""
            rocm_version: "10.1"
            release_tag: "20261018172427"
          - source: "mxxm"
            repo: "https://github.com/mxxm-t/mx-llama.cpp.git"
            latest_type: "tag"
            profile_suffix: "-mxxm"
            rocm_version: "10.1"
            release_tag: "20261018172427"
          - source: "unsloth"
            repo: "https://github.com/unslothai/llama.cpp.git"
            latest_type: "release"
            profile_suffix: "-unsloth"
            rocm_version: "10.1"
            release_tag: "20261018172427"
    env:
      LLAMA_REPO: "${{ matrix.build.repo }}"
      LLAMA_LATEST_TYPE: "${{ matrix.build.latest_type }}"
      LLAMA_ROCM_VERSION: "${{ matrix.build.rocm_version }}"
      LLAMA_PROFILE_SUFFIX: "${{ matrix.build.profile_suffix }}"
      LLAMA_BRANCH: "${{ inputs.llamacpp_tag }}"
      LLAMA_CMAKE_HIP_FLAGS: "-mllvm -amdgpu-sched-strategy=max-ilp"
      LLAMA_FORCE_BUILD: "${{ inputs.force_build && '1' || '0' }}"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ vars.BUILD_REF || matrix.build.release_tag }}
          fetch-depth: 0

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq-action

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select registry and log in
        id: registry
        uses: ./.github/workflows/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build parameters
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          REGISTRY_ROOT: "${{ steps.registry.outputs.registry_root }}"
        run: |
          source ./.build/git-common.sh
          if [ "$LLAMA_BRANCH" == "" ]; then
            LLAMA_BRANCH="$("$GITHUB_WORKSPACE/.github/scripts/github_get_last" --type "$LLAMA_LATEST_TYPE" --repo "$LLAMA_REPO" --github-token "$GITHUB_TOKEN")"
          fi
          : "${REPO_GIT_REF:="$(git_get_current_ref)"}"
          : "${LLAMA_IMAGE:="$REGISTRY_ROOT/llama.cpp-gfx906"}"
          : "${LLAMA_IS_RELEASE:="$([ -n "$(git_get_current_tag)" ] && echo 1 || echo 0)"}"
          : "${LLAMA_BASE_IMAGE:="docker.io/mixa3607/rocm-gfx906:$LLAMA_ROCM_VERSION-complete"}"
          : "${LLAMA_PRESET_NAME:="$LLAMA_BRANCH-rocm-$LLAMA_ROCM_VERSION$LLAMA_PROFILE_SUFFIX"}"

          echo "REPO_GIT_REF=$REPO_GIT_REF"             >> "$GITHUB_ENV"
          echo "LLAMA_IMAGE=$LLAMA_IMAGE"               >> "$GITHUB_ENV"
          echo "LLAMA_IS_RELEASE=$LLAMA_IS_RELEASE"     >> "$GITHUB_ENV"
          echo "LLAMA_BRANCH=$LLAMA_BRANCH"             >> "$GITHUB_ENV"
          echo "LLAMA_PRESET_NAME=$LLAMA_PRESET_NAME"   >> "$GITHUB_ENV"
          echo "LLAMA_BASE_IMAGE=$LLAMA_BASE_IMAGE"     >> "$GITHUB_ENV"

      - name: Check build
        id: check
        run: |
          needed="$(./llama.cpp/build-and-push.image.sh check)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Check base images
        if: steps.check.outputs.needed == 'true'
        run: |
          source ./.build/build-common.sh
          build_require_images "$LLAMA_BASE_IMAGE"

      - name: Aggressive cleanup
        if: steps.check.outputs.needed == 'true'
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Build llama.cpp image
        if: steps.check.outputs.needed == 'true'
        run: ./llama.cpp/build-and-push.image.sh build
