name: Daily llama.cpp build (mxxm)

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build:
          - rocm_version: "7.14"
            release_tag: "20260802001858"
    steps:
      - name: Aggressive cleanup
        uses: ./.github/workflows/actions/cleanup-space-action

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.build.release_tag }}

      - name: Install yq
        uses: ./.github/workflows/actions/install-yq

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        run: |
          cd ./llama.cpp
          export LLAMA_REPO=https://github.com/mxxm-t/mx-llama.cpp.git
          export LLAMA_BRANCH="$(curl -L \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/repos/mxxm-t/mx-llama.cpp/tags?per_page=1' | yq -r '.[0].name')"
          export LLAMA_ROCM_VERSION='${{ matrix.build.rocm_version }}'
          export LLAMA_PRESET_NAME="${LLAMA_BRANCH}-rocm-${LLAMA_ROCM_VERSION}-mxxm"
          ./build-and-push.rocm.sh
