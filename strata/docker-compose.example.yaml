# Qwen3.8-Flash-Next, Unsloth UD-Q4_K_XL, on two 16 GB gfx906 cards.
#
# The image contains the engine only. Mount the GGUF shards read-only and put
# the install config, native pack, and MTP draft on a large disk.
#
#   export API_KEY="choose-a-secret"
#   export RENDER_GID="$(getent group render | cut -d: -f3)"
#   docker compose -f docker-compose.example.yaml up -d
#   docker compose -f docker-compose.example.yaml logs -f
#
# UD-Q4_K_XL loads about 77 GB of experts into RAM at start when several cards
# share the model. Leave RESIDENT_BUDGET_GIB unset: this quant cannot combine
# a RAM budget with a multi-GPU split. A 128 GB host is full during that load.
# restart stays off so a reboot does not fill RAM by itself.

services:
  qwen38-flash:
    image: docker.io/mixa3607/strata-gfx906:v0.1.41-rocm-7.14
    container_name: qwen38-flash
    restart: "no"

    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # video is the name inside the image. RENDER_GID is the host render
    # group's numeric id; the device nodes keep the host's gid.
    group_add:
      - video
      - "${RENDER_GID}"
    ipc: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    ulimits:
      memlock:
        soft: -1
        hard: -1
    stop_grace_period: 60s

    volumes:
      # Unsloth UD-Q4_K_XL shards, four GGUF files.
      - ./models:/models:ro
      # Config, native pack, MTP draft.
      - ./data:/data

    environment:
      AMDGPU_TARGETS: gfx906
      HSA_OVERRIDE_GFX_VERSION: "9.0.6"
      # One card: comment GPUS out and set this to that card's index.
      # ROCR_VISIBLE_DEVICES: "0"
      GPUS: "0,1"
      # Set to 1 only to rewrite ./data after a one-card install. A one-card
      # config may carry a RAM budget, which this split cannot use. Comment
      # it out again once the new config starts.
      # REINSTALL: "1"
      # Optional mirror for the MTP download, when the draft is not in ./data yet.
      # HF_ENDPOINT: https://hf-mirror.com
      FAMILY: unsloth
      MODEL: UD-Q4_K_XL
      GGUF_DIR: /models
      # 262144 is the 256K window this quant was measured with. A smaller
      # value uses less KV memory.
      CONTEXT: "262144"
      VISION: "no"
      KV: int8
      LOW_RAM: "off"
      HOST: 0.0.0.0
      PORT: "8080"
      API_KEY: ${API_KEY:?set API_KEY}

    ports:
      # Host port on the left. Open http://<host>:8080/
      - "8080:8080"
